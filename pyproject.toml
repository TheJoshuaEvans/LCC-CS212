[project]
name = "lcc-cs212"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "tensorflow>=2.21.0",
    "wikipedia-api>=0.16.0",
    "z3-solver>=5.1.0.0",
]

[dependency-groups]
dev = [
    "importlib-resources>=7.1.0",
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "tensorflow-datasets>=4.9.10",
    "tzdata>=2026.4 ; sys_platform == 'win32'",
]

[tool.ruff]
extend-exclude = ["course-materials"]

[tool.ruff.lint]
# Mirrors course-materials/docs/Labs/PythonStyleAndBestPracticesChecklist.md
extend-select = [
    "I",       # imports ordered: stdlib, third-party, local
    "N",       # snake_case / PascalCase / ALL_CAPS naming
    "ERA",     # commented-out code
    "PLR2004", # magic numbers instead of named constants
    "B",       # likely bugs
    "SIM",     # needlessly complex code
    "UP",      # modern Python syntax
]

[tool.pytest.ini_options]
norecursedirs = [".*", "course-materials"]
